
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Tracing TBC - BKK Probolinggo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      font-family: Arial, sans-serif;
      color: #087c83;
      font-size: 15px;
      z-index: 2;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #d9eeee;
      border-top-color: #087c83;
      border-radius: 50%;
      animation: putar 0.8s linear infinite;
      margin-right: 12px;
    }

    @keyframes putar {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="spinner"></div>
    Memuat aplikasi TBC...
  </div>

  <iframe
    id="app"
    src="https://bkk.s.gy/tbc"
    allow="fullscreen"
    allowfullscreen
    onload="document.getElementById('loading').style.display='none'">
  </iframe>

</body>
</html>
